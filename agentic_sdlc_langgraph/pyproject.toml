[project]
name = "agentic-sdlc-langgraph"
version = "0.1.0"
description = "LangGraph-based execution engine for the Agentic SDLC G1-G10 lifecycle (Phase 0 spike: G1-G3)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_sdlc_langgraph"]
